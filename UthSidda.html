<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PlaceHolder</title>
</head>

<body>
    <h2 id="välkommen"></h2> <br>
    
    <p id="output">Inaktiv</p>

    <img src="h:\Webbutveckling\Bilder\Elscooter.png" alt=""><br>
    <button id="scooter1">Scooter1</button>

    <p id="output2">Tid(s):</p>
    <p id="output3"></p>

    

    <script>

        let sc1 = false;
        let timerId = 0;
        let räknare = 0;
        let tid = new Date();

        const params = new URLSearchParams(window.location.search);
        const text = document.getElementById('välkommen');
        let användarnamn = params.get('användarnamn');
        text.textContent = `Välkommen ${användarnamn}!`;
        
        const text2 = document.getElementById('output');
        const scooter1 = document.getElementById('scooter1');

        const text3 = document.getElementById('output2');
        const text4 = document.getElementById('output3');

        scooter1.addEventListener('click', function (event){
            if (sc1 == false) {
                sc1 = true;
                text2.textContent = "Uthyrning är pågående!";
                text4.textContent = "";
            

            timerId = setInterval (function() {
                if (sc1 == true) {
                    räknare ++;
                    text3.textContent = "Tid(s):"+ räknare;
                }

                else if (sc1 == false) {
                    text3.textContent = "Tid(s):";
                }
            }, 1000)
            }
            else{
                clearInterval(timerId);
                text2.textContent = "Inaktiv";
                text3.textContent = "Tid(s):";
                text4.textContent = "Senaste uthyrning skedde  " + tid + ", och varade i " + räknare + " sekunder.";
                räknare = 0;
                sc1 = false;
            }
        })

    </script>

</body>
</html>
