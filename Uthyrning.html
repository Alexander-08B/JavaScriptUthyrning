<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PlaceHolder</title>
    
</head>

<body>
    <h1>Inloggnings sida</h1><br><!--Titel-->

    <div><!--Detta stycke är indelat i en div för att underlätta styling mha css.-->
    <form id = "inloggForm"><!--Stycket innehåller kod för att skapa inloggnings pannelen.-->
        <label for = "användarnamn">Ange ditt användarnamn:</label>
        <input type ="text" id= "användarnamn" name= "användarnamn"><br><br>
        
        <label for = "lösenord">Ange ditt lösenord:</label>
        <input type = "password" id= "lösenord" name= "lösenord"><br>
        
        <input type = "submit" value= "Logga in">
    </form>
    </div>
    
    <script>//Nedanstående kod möjliggör inläsning av användarnamn och löseneord samt skapar en knapp för bekräfta de inmatade uppgifterna, 
    //vilket antigen resulterar i att man loggas in, eller får ett meddelande som berättar att uppgifterna är felaktiga.  
        let användarnamn = null;
        const form = document.getElementById('inloggForm');

        form.addEventListener('submit', function (event){
            event.preventDefault(); 
            const text = document.getElementById('användarnamn').value;
            const lösenord = document.getElementById('lösenord').value;
            
            if(text == "ab" && lösenord == "123"){//Denna if-sats vidarskickar användaren till nästa webbsida om lösenord och användarnamn är korrekta.
                användarnamn = text;
                window.location.href = `UthSidda.html?användarnamn=${encodeURIComponent(användarnamn)}`;
            }
            else{
                alert("Fel användarnamn eller lösenord!");//Skickar meddelandet angående felaktiga uppgifter vid fel inmatning.
            }
        });
    </script>

</body>
</html>
